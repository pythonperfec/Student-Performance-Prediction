<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ScholarSight{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body>
    <div class="grain"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="mark">SS</span>
        <span>
          <strong>ScholarSight</strong>
          <small>Student performance prediction</small>
        </span>
      </a>
      <nav>
        <a href="/" class="{{ 'is-active' if active == 'predict' else '' }}">Predict</a>
        <a href="/insights" class="{{ 'is-active' if active == 'insights' else '' }}">Model insights</a>
        <a href="/docs">API docs</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <p>MIT licensed · sklearn Pipeline · FastAPI · HTML/CSS</p>
    </footer>
  </body>
</html>
